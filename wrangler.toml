name = "kayvora-ai-audit"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Secrets (set these with `wrangler secret put NAME`, NOT here in plain text):
#   GEMINI_API_KEY       - same key used on the main Kayvora AI site
#   PAGESPEED_API_KEY    - free Google Cloud API key (see README)
#   SHEET_WEBHOOK_URL    - your Google Apps Script webhook URL (see README)
